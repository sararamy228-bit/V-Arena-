<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V ARENA — فريق طيبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E0F3D;--bg2:#3B1D78;--ink:#FFFFFF;--mut:#CBB8F5;--gold:#FFFFFF;--red:#C9A7FF;--card:#2A1558;--line:#7C4DDB;--on-gold:#3B1D78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3EDFF;--bg2:#E0D0FF;--ink:#2A1558;--mut:#5E3FA3;--card:#FFFFFF;--line:#9B72E8;--gold:#6C3CD1;--on-gold:#FFFFFF;--red:#8A5CF0}}
:root[data-theme="dark"]{--bg:#1E0F3D;--bg2:#3B1D78;--ink:#FFFFFF;--mut:#CBB8F5;--card:#2A1558;--line:#7C4DDB;--gold:#FFFFFF;--on-gold:#3B1D78;--red:#C9A7FF}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg));background-color:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:500}
#app{max-width:480px;margin:0 auto;padding:16px 16px 56px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;font-weight:900}h2{font-size:22px}
.logo{font-family:Cairo,sans-serif;font-weight:900;font-size:64px;letter-spacing:2px;text-align:center;color:var(--gold);text-shadow:0 4px 0 #7C4DDB}
.sub{text-align:center;color:var(--mut)}
.btn{background:var(--gold);color:var(--on-gold);border:0;border-radius:14px;padding:14px 18px;font:900 18px Cairo,sans-serif;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 18px Cairo,sans-serif}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:700;background:var(--card)}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.top{display:flex;justify-content:space-between;font-weight:900}
.pitch{position:relative;height:300px;border-radius:18px;background:repeating-linear-gradient(0deg,#6D3FD1 0 30px,#5F33BF 30px 60px);border:3px solid #fff;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:50% 0 auto;border-top:2px solid #ffffff88}
.slot{position:absolute;transform:translate(50%,-50%);width:74px;text-align:center;font-size:12px;font-weight:700}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font:900 18px Cairo;background:#0006;color:#fff;border:2px dashed #fff8}
.dot.me{background:#fff;color:#3B1D78;border:2px solid #fff;box-shadow:0 0 18px #fff}
.dot.f{border:2px solid #fff;background:#fff;color:#3B1D78}.dot.sel{box-shadow:0 0 0 5px #fff,0 0 22px #fff}.slot{cursor:pointer}.bn{display:inline-block;margin:0 0 8px 8px;padding:8px 14px}
.pcard{border-radius:18px;padding:18px;text-align:center;color:#fff;position:relative;border:3px solid #ffffffaa}
.t1{background:linear-gradient(150deg,#FFFFFF,#D9C6FF);color:#3B1D78}.t2{background:linear-gradient(150deg,#9B6BFF,#5B2EC7)}.t3{background:linear-gradient(150deg,#6D3FD1,#3B1D78)}.t0{background:linear-gradient(150deg,#8d7bb8,#4a3a75)}
.pcard .num{font:900 54px Cairo;line-height:1}.pcard .nm{font:900 24px Cairo;margin:6px 0}.badge{display:inline-block;background:#0004;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.t1 .badge{background:#3B1D7822}
.box{font-size:92px;text-align:center;cursor:pointer;user-select:none}
.shake{animation:sh .5s infinite}@keyframes sh{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.pop{animation:pop .6s both}@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
.q{background:var(--card);border-radius:16px;padding:16px;border:2px solid var(--line)}
.q p{font:900 20px/1.6 Cairo;margin:0 0 12px}
.opt{display:block;width:100%;text-align:right;margin-bottom:8px;padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 17px Cairo,sans-serif;cursor:pointer}
.opt.ok{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}.opt.no{background:transparent;border-color:var(--red);text-decoration:line-through;opacity:.7}
.score{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;border:2px solid var(--line);font-weight:900}
.score b{font-size:34px;color:var(--gold)}.clock{font:900 26px Cairo;background:var(--gold);color:var(--on-gold);border-radius:10px;padding:2px 12px}
.feed{display:flex;flex-direction:column;gap:8px}
.ev{border-radius:12px;padding:10px 12px;background:var(--card);border-inline-start:6px solid var(--line);animation:pop .4s both}
.ev.g{border-color:var(--gold)}.ev.o{border-color:var(--red)}.ev.y{border-color:#ffffff}.ev small{color:var(--mut);display:block;font-weight:700}
.cert{border:4px double var(--gold);border-radius:18px;padding:20px;text-align:center;background:var(--card);position:relative}
.cert .big{font:900 28px Cairo;color:var(--gold)}
.wm{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:900 15px Cairo,sans-serif;direction:ltr;color:var(--gold);opacity:.7;pointer-events:none;z-index:5}
.wm.pitch-wm{opacity:.25}
.inwm{position:absolute;bottom:6px;left:10px;direction:ltr;font:900 12px Cairo;opacity:.7}
.small{font-size:13px;color:var(--mut);text-align:center}
a.rs{color:var(--mut);font-size:12px;text-align:center;cursor:pointer;text-decoration:underline}
</style>

function matchSlots(){
  var now=Date.now(),day=new Date().toDateString();
  if(S.matchDay!==day){S.matchDay=day;S.matchTimes=[];save()}
  S.matchTimes=(S.matchTimes||[]).filter(function(t){return now-t<86400000});
  return S.matchTimes;
}
function canMatch(){
  var a=matchSlots(),now=Date.now();
  if(a.length>=2)return {ok:false,msg:"خلصت مباراتيك لليوم. مسموح مباراتين فقط كل 24 ساعة."};
  if(a.length===1){
    var left=432000-(now-a[0]);
    if(left>0)return {ok:false,msg:"المباراة التالية متاحة بعد "+fmtWait(left)+"."};
  }
  return {ok:true};
}
function fmtWait(ms){
  var h=Math.floor(ms/3600000),m=Math.ceil((ms%3600000)/60000);
  return h+" ساعة"+(m? " و"+m+" دقيقة":"");
}
function consumeMatch(){
  matchSlots().push(Date.now());save();

function roomWaiting(conn,isHost){
  var box=document.getElementById("rsx");

  if(isHost)setTimeout(function(){if(S.room&&S.room.conn===conn){conn.send({type:"start",host:S.name,guest:S.room.guestName||"الضيف"});matchOnline(true)}},800);
}
function handleRoomMsg(msg,conn){
  if(!msg)return;
  if(msg.type==="hello"){
    if(S.room&&S.room.role==="host"){S.room.guestName=msg.name;save();roomWaiting(conn,true)}
    else if(S.room&&S.room.role==="guest"){S.room.hostName=msg.name;save()}
  }
  if(msg.type==="start" && S.room&&S.room.role==="guest")matchOnline(false);
  if(msg.type==="result")onlineResult(msg);
}
function matchOnline(isHost){

function wpick(us){var W=[.2,1,2,3,4],t=0,r,i;W.forEach(function(x){t+=x});r=Math.random()*t;for(i=0;i<5;i++){r-=W[i];if(r<=0)return us[i]}return us[4]}
function build(){
 var own=S.lineup.filter(function(v){return v&&v!=="@me"}).length,us=S.lineup.map(function(v){return v?nameOf(v):"لاعب مجهول"});
 var opp=["فريق طيبة","فريق كيميت","فريق النيل","فريق الفيوم","فريق حورس","فريق منف","فريق الدلتا","فريق رع","فريق الأقصر","فريق الغيط"],
 mins=[45,90],ev=[],gu=0,go=0;
 while(mins.length<11){var m=3+rnd(86);if(mins.indexOf(m)<0)mins.push(m)}
 mins.sort(function(a,b){return a-b});
 var pUs=.38+.07*own;
 mins.forEach(function(m){
  if(m===45){ev.push({m:45,k:"h",t:"نهاية الشوط الأول",s:"النتيجة "+gu+" - "+go+"، الفريقان يلتقطان أنفاسهما",gu:gu,go:go});return}
  if(m===90){ev.push({m:90,k:"e",t:"صافرة النهاية",s:"انتهت المباراة",gu:gu,go:go});return}
  var side=Math.random()<pUs?"u":"o",r=Math.random(),who=side==="u"?wpick(us):pick(opp),against=side==="u"?"فريق طيبة":"فريقك";

<script>
(function(){
  let deferredPrompt = null;
  const installBtn = document.getElementById('installGameBtn');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function hideInstall(){
    if (installBtn) {
      installBtn.style.display = 'none';
      installBtn.remove();
    }
  }

  if (isStandalone()) hideInstall();

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = '';
  });

  if (installBtn) {
    installBtn.addEventListener('click', async function(){
      if (!deferredPrompt) {
        alert('لو زر التثبيت مش ظاهر، افتحي اللعبة من رابط HTTPS في Chrome، وبعدها اضغطي تنزيل اللعبة.');
        return;
      }
      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (result && result.outcome === 'accepted') hideInstall();
    });
  }

  window.addEventListener('appinstalled', hideInstall);
})();
</script>


<script>
(function(){
  const btn = document.getElementById('installGameBtn');
  let deferredPrompt = null;

  function standalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }
  function hide(){
    if(btn){ btn.style.display='none'; }
  }
  if(standalone()) hide();

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
  });

  if(btn){
    btn.addEventListener('click', async function(){
      if(deferredPrompt){
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(choice && choice.outcome === 'accepted') hide();
        return;
      }
      if(location.protocol === 'file:'){
        alert('اللعبة مفتوحة كملف مباشر. لظهورها كتطبيق على الشاشة الرئيسية، افتحيها من رابط HTTPS ثم اضغطي «تنزيل اللعبة».');
      }else{
        alert('لو التثبيت مش ظاهر، افتحي قائمة Chrome ثم اختاري «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».');
      }
    });
  }
  window.addEventListener('appinstalled', hide);
})();
</script>
